services:
  tracker:
    build: .
    container_name: fitness-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./storage/fitness_tracker:/storage/fitness_tracker
    environment:
      OLLAMA_URL: "http://gpu-worker:11434"
      VISION_MODEL: "${VISION_MODEL:-gemma4:12b}"
      OLLAMA_TIMEOUT: "180"
      TZ: "${TZ:-Europe/Madrid}"
      STORAGE_DIR: "/storage/fitness_tracker"
      DB_PATH: "/storage/fitness_tracker/tracker.db"
    extra_hosts:
      - "gpu-worker:100.102.124.29"

  proxy:
    image: nginx:alpine
    container_name: fitness-tracker-proxy
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      - tracker
