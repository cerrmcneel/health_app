services:
  tracker:
    build: .
    container_name: localpulse
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./storage/fitness_tracker:/storage/fitness_tracker
    environment:
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      VISION_MODEL: "${VISION_MODEL:-gemma4:12b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-180}"
      TZ: "${TZ:-Europe/Madrid}"
      STORAGE_DIR: "/storage/fitness_tracker"
      DB_PATH: "/storage/fitness_tracker/tracker.db"
      APP_PASSWORD: "${APP_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  proxy:
    image: nginx:alpine
    container_name: localpulse-proxy
    profiles: ["ssl"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs
    command: >
      /bin/sh -c "
      if [ ! -f /certs/cert.pem ] || [ ! -f /certs/key.pem ]; then
        echo 'Generating self-signed TLS certificate for local HTTPS...' &&
        apk add --no-cache openssl >/dev/null 2>&1 &&
        mkdir -p /certs &&
        openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
          -keyout /certs/key.pem -out /certs/cert.pem \
          -subj '/CN=localhost';
      fi;
      nginx -g 'daemon off;'
      "
    depends_on:
      - tracker

